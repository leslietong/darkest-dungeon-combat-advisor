[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ddca"
version = "0.1.0"
description = "Read-only real-time combat assistant for Darkest Dungeon 1."
readme = "README.md"
requires-python = ">=3.11,<3.12"
authors = [{ name = "Darkest Dungeon Combat Advisor contributors" }]
keywords = ["darkest-dungeon", "combat-advisor", "read-only"]
dependencies = [
    "mss>=9.0.0",
    "numpy>=1.24",
    "opencv-python>=4.8",
    "pywin32>=306",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
